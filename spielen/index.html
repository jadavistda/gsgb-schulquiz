let OFFSET=0;
async function syncZeit(){
  try{ const t0=Date.now(); const r=await fetch(location.href,{method:"HEAD",cache:"no-store"}); const t1=Date.now();
    const d=r.headers.get("date"); if(d){ const age=parseInt(r.headers.get("age")||"0",10)||0;
      const srv=new Date(d).getTime()+age*1000+500+(t1-t0)/2; OFFSET=srv-t1; } }catch(e){}
}
function jetzt(){ return (Date.now()+OFFSET-CFG.epoch)/1000; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const _perm={};
function perm(c){ if(_perm[c]) return _perm[c]; const r=mulberry32((CFG.seed+c*7919)|0); const p=Q.map((_,i)=>i); for(let i=p.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const x=p[i]; p[i]=p[j]; p[j]=x; } _perm[c]=p; return p; }
function plan(t){ const slot=CFG.frage+CFG.loesung, n=Q.length; const g=Math.floor(t/slot), s=t-g*slot; const c=Math.floor(g/n), k=g-c*n;
  return s<CFG.frage?{g:g,c:c,k:k,phase:"frage",rest:CFG.frage-s,elapsed:s}:{g:g,c:c,k:k,phase:"loesung",rest:slot-s}; }
function frageBei(p){ return Q[perm(p.c)[p.k]]; }
function naechste(p){ return p.k+1<Q.length?Q[perm(p.c)[p.k+1]]:Q[perm(p.c+1)[0]]; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function konfetti(n){ const K=document.getElementById("konfetti"); if(!K) return; const F=["#e2b93b","#fff6dd","#c8102e","#1f4e9c","#ffffff"];
  for(let i=0;i<n;i++){ const d=document.createElement("i"); d.style.left=(Math.random()*100)+"%"; d.style.background=F[i%F.length];
    d.style.animationDuration=(9+Math.random()*9)+"s"; d.style.animationDelay=(-Math.random()*18)+"s"; d.style.width=d.style.height=(0.5+Math.random()*0.7)+"vh";
    d.style.transform="rotate("+(Math.random()*360)+"deg)"; K.appendChild(d); } }
const FORM=["▲","◆","●","■","★","✚"];

let st=lade(), shown=null;
function lade(){ try{ const s=JSON.parse(localStorage.getItem("gsgbquiz2")||"null"); if(s&&s.ant) return s }catch(e){} return {ant:{}} }
function speichern(){ try{ localStorage.setItem("gsgbquiz2",JSON.stringify(st)) }catch(e){} }
function neu(){ st={ant:{}}; speichern(); malPunkte(); }
function summe(){ let p=0,ri=0,n=0; for(const g in st.ant){n++; p+=st.ant[g].punkte; if(st.ant[g].richtig) ri++} return {p,ri,n} }
function zeige(p){
  const q=frageBei(p);
  document.getElementById("frage").textContent=q.frage;
  document.getElementById("zaehler").textContent="Frage "+(p.k+1)+" von "+Q.length;
  document.getElementById("app").classList.toggle("mitbild",!!q.bild); if(q.bild) document.getElementById("img").src=q.bild;
  const A=document.getElementById("antworten"); A.innerHTML="";
  q.antworten.forEach((t,n)=>{const d=document.createElement("button");d.className="a a"+n+(q.korrekt.includes(n+1)?" ok":"");d.innerHTML='<span class="f">'+FORM[n]+'</span><span>'+esc(t)+'</span>';d.onclick=()=>wahl(p.g,n+1);A.appendChild(d)});
  A.style.gridTemplateColumns=q.antworten.length>4?"1fr 1fr 1fr":"1fr 1fr";
  document.getElementById("app").classList.remove("reveal");
  const a=st.ant[p.g]; if(a){ sperren(a.wahl); setStatus("Antwort gespeichert ✓","") } else setStatus("Tippe die richtige Antwort an.","");
}
function sperren(w){ document.querySelectorAll("#antworten .a").forEach((d,n)=>{ d.disabled=true; d.classList.toggle("gewaehlt",n+1===w) }) }
function setStatus(t,c){ const s=document.getElementById("status"); s.textContent=t; s.className=c }
function wahl(g,w){
  const p=plan(jetzt()); if(p.phase!=="frage"||p.g!==g||st.ant[g]) return;
  const q=frageBei(p); const richtig=q.korrekt.includes(w);
  const punkte=richtig?Math.round(1000*(1-(p.elapsed/CFG.frage)/2)):0;
  st.ant[g]={wahl:w,richtig:richtig,punkte:punkte}; const ks=Object.keys(st.ant); if(ks.length>400) delete st.ant[ks[0]];
  speichern(); sperren(w); setStatus("Antwort gespeichert ✓",""); malPunkte();
}
function malPunkte(){ const s=summe(); document.getElementById("punkte").firstChild.textContent=s.p+" Punkte"; document.getElementById("bilanz").textContent=s.n?s.ri+" von "+s.n+" richtig":"" }
function tick(){
  const p=plan(jetzt());
  if(p.g!==shown){ zeige(p); shown=p.g; }
  if(p.phase==="frage"){ document.getElementById("bari").style.width=(100*p.rest/CFG.frage)+"%"; }
  else { document.getElementById("bari").style.width="0%"; document.getElementById("app").classList.add("reveal");
    const a=st.ant[p.g]; if(!a) setStatus("Keine Antwort. Nächste Frage gleich.","schlecht"); else if(a.richtig) setStatus("Richtig! +"+a.punkte+" Punkte","gut"); else setStatus("Leider falsch.","schlecht"); }
}
konfetti(18); malPunkte(); syncZeit().then(tick); setInterval(syncZeit,300000); setInterval(tick,250);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ syncZeit(); shown=null; } });
