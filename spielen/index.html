let OFFSET=0;
async function syncZeit(){
  try{ const t0=Date.now(); const r=await fetch(location.href,{method:"HEAD",cache:"no-store"}); const t1=Date.now();
    const d=r.headers.get("date"); if(d){ const age=parseInt(r.headers.get("age")||"0",10)||0;
      const srv=new Date(d).getTime()+age*1000+500+(t1-t0)/2; OFFSET=srv-t1; } }catch(e){}
}
function jetzt(){ return (Date.now()+OFFSET-CFG.epoch)/1000; }
function plan(t){
  const slot=CFG.frage+CFG.loesung, rl=CFG.runde*slot+CFG.pause;
  const r=Math.floor(t/rl), w=t-r*rl;
  if(w>=CFG.runde*slot) return {runde:r,phase:"pause",rest:rl-w,k:CFG.runde};
  const k=Math.floor(w/slot), s=w-k*slot;
  if(s<CFG.frage) return {runde:r,phase:"frage",rest:CFG.frage-s,k:k,elapsed:s};
  return {runde:r,phase:"loesung",rest:slot-s,k:k};
}
function frage(r,k){ return Q[PERM[((r*CFG.runde+k)%PERM.length+PERM.length)%PERM.length]]; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
const FORM=["▲","◆","●","■","★","✚"];

let st=lade(), shown=null;
function lade(){ try{ const s=JSON.parse(localStorage.getItem("gsgbquiz")||"null"); if(s&&typeof s.runde==="number") return s }catch(e){} return {runde:-1,ant:{}} }
function speichern(){ try{ localStorage.setItem("gsgbquiz",JSON.stringify(st)) }catch(e){} }
function summe(){ let p=0,ri=0,n=0; for(const k in st.ant){n++; p+=st.ant[k].punkte; if(st.ant[k].richtig) ri++} return {p,ri,n} }
function zeige(r,k){
  const q=frage(r,k);
  document.getElementById("frage").textContent=q.frage;
  document.getElementById("zaehler").textContent="Runde "+(r+1)+" · Frage "+(k+1)+" von "+CFG.runde;
  const b=document.getElementById("bild"); if(q.bild){document.getElementById("img").src=q.bild; b.style.display="block"} else b.style.display="none";
  const A=document.getElementById("antworten"); A.innerHTML="";
  q.antworten.forEach((t,n)=>{const d=document.createElement("button");d.className="a a"+n+(q.korrekt.includes(n+1)?" ok":"");d.innerHTML='<span class="f">'+FORM[n]+'</span><span>'+esc(t)+'</span>';d.onclick=()=>wahl(r,k,n+1);A.appendChild(d)});
  A.style.gridTemplateColumns=q.antworten.length>4?"1fr 1fr 1fr":"1fr 1fr";
  document.getElementById("app").classList.remove("reveal");
  const a=st.ant[k]; if(a){ sperren(a.wahl); setStatus("Antwort gespeichert ✓","") } else setStatus("Tippe die richtige Antwort an.","");
}
function sperren(w){ document.querySelectorAll("#antworten .a").forEach((d,n)=>{ d.disabled=true; d.classList.toggle("gewaehlt",n+1===w) }) }
function setStatus(t,c){ const s=document.getElementById("status"); s.textContent=t; s.className=c }
function wahl(r,k,w){
  const p=plan(jetzt()); if(p.phase!=="frage"||p.runde!==r||p.k!==k||st.ant[k]) return;
  const q=frage(r,k); const richtig=q.korrekt.includes(w);
  const punkte=richtig?Math.round(1000*(1-(p.elapsed/CFG.frage)/2)):0;
  st.ant[k]={wahl:w,richtig:richtig,punkte:punkte}; speichern(); sperren(w); setStatus("Antwort gespeichert ✓",""); malPunkte();
}
function malPunkte(){ document.getElementById("punkte").textContent=summe().p+" Punkte" }
function tick(){
  const p=plan(jetzt());
  if(p.runde!==st.runde){ st={runde:p.runde,ant:{}}; speichern(); shown=null; malPunkte(); }
  document.body.classList.toggle("phase-pause",p.phase==="pause");
  if(p.phase==="pause"){ const s=summe(); document.getElementById("ergebnis").textContent=s.p+" Punkte"; document.getElementById("ergtext").textContent=s.ri+" von "+CFG.runde+" richtig"; document.getElementById("pauserest").textContent=Math.ceil(p.rest); shown=null; return; }
  const key=p.runde+":"+p.k; if(key!==shown){ zeige(p.runde,p.k); shown=key; }

  else { document.getElementById("bari").style.width="0%"; document.getElementById("app").classList.add("reveal");
    const a=st.ant[p.k]; if(!a) setStatus("Keine Antwort. Nächste Frage gleich.","schlecht"); else if(a.richtig) setStatus("Richtig! +"+a.punkte+" Punkte","gut"); else setStatus("Leider falsch.","schlecht"); }
}
malPunkte(); syncZeit().then(tick); setInterval(syncZeit,300000); setInterval(tick,250);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ syncZeit(); shown=null; } });
